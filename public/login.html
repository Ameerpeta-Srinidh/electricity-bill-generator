<!DOCTYPE html>
<html>

<head>
  <title>Login - Electricity Bill System</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #343a40;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ced4da;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #0069d9;
    }

    #msg {
      color: #dc3545;
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }

    a {
      display: block;
      margin-top: 20px;
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="login()">Sign In</button>
    <p id="msg"></p>
    <a href="register.html">New User? Apply for Connection</a>
    <a href="employee_register.html" class="link"
      style="font-size: 14px; text-align: center; color: #666; margin-top: 10px;">Employee Registration</a>
  </div>

  <script>
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      msg.innerText = "Logging in...";

      try {
        const res = await fetch("http://localhost:3000/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("user", JSON.stringify(data.user));

          if (data.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else if (data.user.role === 'employee') {
            window.location.href = 'employee.html';
          } else {
            window.location.href = 'user.html';
          }
        } else {
          msg.innerText = data.error;
        }
      } catch (e) {
        msg.innerText = "Connection Error";
      }
    }
  </script>
</body>

</html>
